<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#14233c">
    <link rel="manifest" href="manifest.json">
    <title>Laporan Purchase Order</title>
</head>
<body class="po-page">
     <header class="data-po">
        <h2>Laporan Purchase Order</h2>
    </header>
    <div class="filter-box">
        <label>Bulan</label>
        <select id="bulanLaporan" onchange="tampilLaporan()">
            <option value="">Semua Bulan</option>
            <option value="01">Januari</option>
            <option value="02">Februari</option>
            <option value="03">Maret</option>
            <option value="04">April</option>
            <option value="05">Mei</option>
            <option value="06">Juni</option>
            <option value="07">Juli</option>
            <option value="08">Agustus</option>
            <option value="09">September</option>
            <option value="10">Oktober</option>
            <option value="11">November</option>
            <option value="12">Desember</option>
        </select>
        <label for="">Tahun</label>
        <select id="tahunLaporan" onchange="tampilLaporan()">
            <option value="">Semua Tahun</option>
            <option>2020</option>
            <option>2021</option>
            <option>2022</option>
            <option>2023</option>
            <option>2024</option>
            <option>2025</option>
            <option>2026</option>
            <option>2027</option>
            <option>2028</option>
            <option>2029</option>
            <option>2030</option>
        </select>
    </div>
    <div class="rigkasan">
        <div class="box-ringkasan">
            <h4>Total PO</h4>
            <p id="jumlah-po">0</p>
        </div>
         <div class="box-ringkasan">
            <h4>Total Penjualan</h4>
            <p id="total-jual">0</p>
        </div>
         <div class="box-ringkasan">
            <h4>Total Profit</h4>
            <p id="total-profit">0</p>
        </div>
    </div>
    <div class="table-wrapper">
        <table class="laporan-table">
            <thead>
                <tr>
                    <th>No PO</th>
                    <th>PT</th>
                    <th>Tanggal</th>
                    <th>Barang</th>
                    <th>Qty</th>
                    <th>Total</th>
                    <th>Profit</th>
                </tr>
            </thead>
            <tbody id="isi-laporan">

            </tbody>
        </table>
    </div>
    <button class="btn-laporan" onclick="window.print()">Cetak Laporan</button>

    <script src="indexed.js"></script>
    <script src="pwa.js"></script>
</body>
</html>
